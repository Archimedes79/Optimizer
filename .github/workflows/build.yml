name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and release APK
    runs-on: ubuntu-latest

    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # compileSdk asks for minor API level 36.1. The package only exists in
      # channels that already ship it, so a missing package must not fail the
      # build - android-36 stays the floor.
      - name: Try the android-36.1 platform
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36.1" \
            || echo "platforms;android-36.1 is not available in this SDK channel; continuing with platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # A tagged build carries the tag's version instead of the default in
      # app/build.gradle.kts. v1.2.3 -> versionName 1.2.3.
      - name: Derive version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "appVersionName=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "appVersionCode=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Optional: as soon as the four RELEASE_* secrets exist, the APK is signed
      # with the real upload key. Until then the build falls back to the debug
      # key and the APK is still installable.
      - name: Decode the signing keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "RELEASE_KEYSTORE_BASE64 decoded to an empty file - check the secret"
            exit 1
          fi
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build the release APK
        run: ./gradlew --stacktrace assembleRelease

      - name: Collect the APK
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then echo "No APK produced"; exit 1; fi
          apk="${apks[0]}"
          if [ -n "${RELEASE_KEYSTORE_FILE:-}" ]; then signed="signed"; else signed="debugsigned"; fi
          name="PortfolioOptimizerClassic-${GITHUB_REF_NAME//\//-}-${signed}.apk"
          cp "$apk" "dist/$name"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "Built dist/$name"

      - name: Upload the test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioOptimizerClassic-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.collect.outputs.signed }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(dist/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then echo "No APK to publish"; exit 1; fi
          if [ "$SIGNED" = "signed" ]; then
            note="Signed with the project upload key."
          else
            note="Signed with the Android debug key. Installable, but it cannot update an install that used a different key. See docs/RELEASING.md."
          fi
          # Re-running the same tag must not fail on an existing release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists - uploading the APK with --clobber"
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk \
              --title "Portfolio Optimizer Classic $GITHUB_REF_NAME" \
              --notes "$(printf 'Install the APK below on Android 7.0 or newer.\n\n%s\n\nInstalling from outside an app store requires allowing "Install unknown apps" for your browser or file manager once.' "$note")"
          fi
