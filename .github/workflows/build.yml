name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and release APK
    runs-on: ubuntu-latest

    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # A tagged build carries the tag's version instead of the default in
      # app/build.gradle.kts. v1.2.3 -> versionName 1.2.3.
      - name: Derive version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "appVersionName=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "appVersionCode=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Optional: as soon as the four RELEASE_* secrets exist, the APK is signed
      # with the real upload key. Until then the build falls back to the debug
      # key and the APK is still installable.
      - name: Decode the signing keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build the release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect the APK
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then echo "No APK produced"; exit 1; fi
          if [ -n "${RELEASE_KEYSTORE_FILE:-}" ]; then signed="signed"; else signed="debugsigned"; fi
          name="PortfolioOptimizerClassic-${GITHUB_REF_NAME//\//-}-${signed}.apk"
          cp "$apk" "dist/$name"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "Built dist/$name"

      - name: Upload the test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioOptimizerClassic-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.collect.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "signed" ]; then
            note="Signed with the project upload key."
          else
            note="Signed with the Android debug key. Installable, but it cannot update an install that used a different key. See docs/RELEASING.md."
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "Portfolio Optimizer Classic $GITHUB_REF_NAME" \
            --notes "$(printf 'Install the APK below on Android 7.0 or newer.\n\n%s\n\nInstalling from outside an app store requires allowing "Install unknown apps" for your browser or file manager once.' "$note")"
